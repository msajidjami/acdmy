<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>سبحان اللہ • Tap & Earn | Islamic Mini App</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background: linear-gradient(145deg, #0a2f2a 0%, #06312b 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
      padding: 16px;
    }
    .app-card {
      max-width: 500px;
      width: 100%;
      background: rgba(255, 248, 225, 0.96);
      border-radius: 64px 48px 64px 48px;
      box-shadow: 0 25px 45px rgba(0,0,0,0.3);
      overflow: hidden;
    }
    .header {
      background: #2c5a3e;
      padding: 20px;
      text-align: center;
      color: #ffefcf;
      border-bottom: 3px solid #e9b35f;
    }
    .header h1 {
      font-size: 1.9rem;
      display: flex;
      justify-content: center;
      gap: 10px;
    }
    .balance-card {
      background: #2f4f36;
      margin: 20px;
      border-radius: 48px;
      padding: 18px;
      text-align: center;
    }
    .coin-value {
      font-size: 4rem;
      font-weight: 800;
      color: #ffd966;
      background: #1f3c28;
      display: inline-block;
      padding: 5px 28px;
      border-radius: 60px;
      margin-top: 8px;
    }
    .tap-zone {
      position: relative;
      background: #e9dbbd;
      margin: 12px 20px;
      border-radius: 48px;
      cursor: pointer;
      box-shadow: 0 12px 20px rgba(0,0,0,0.2);
      overflow: hidden;
    }
    .tap-circle {
      background: radial-gradient(circle at 30% 25%, #ffe0a3, #d9b45b);
      margin: 25px;
      padding: 48px 20px;
      border-radius: 100px;
      text-align: center;
      font-size: 2rem;
      font-weight: bold;
      box-shadow: inset 0 1px 4px rgba(255,255,200,0.8), 0 6px 0 #8b6942;
    }
    .tap-zone:active .tap-circle {
      transform: scale(0.97);
    }
    .floating-dhikr {
      position: absolute;
      pointer-events: none;
      font-size: 1.3rem;
      font-weight: bold;
      color: #ffec80;
      background: rgba(33, 65, 35, 0.8);
      backdrop-filter: blur(6px);
      padding: 5px 12px;
      border-radius: 50px;
      white-space: nowrap;
      animation: floatUpFade 0.9s ease-out forwards;
      z-index: 200;
    }
    @keyframes floatUpFade {
      0% { opacity: 1; transform: translateY(0px) scale(0.9); }
      100% { opacity: 0; transform: translateY(-70px) scale(0.9); visibility: hidden; }
    }
    .ad-panel {
      background: #1f3c2c;
      margin: 0 20px 28px;
      border-radius: 40px;
      padding: 18px;
      text-align: center;
    }
    .timer-info {
      background: #0f2a1f;
      border-radius: 60px;
      padding: 8px 12px;
      display: inline-flex;
      gap: 10px;
      font-size: 1.2rem;
      font-weight: bold;
      color: #ffeaac;
      margin-bottom: 15px;
    }
    .ad-button, .ad-loading, .waiting-message {
      font-size: 1.1rem;
      font-weight: 600;
      border: none;
      background: #f0b34b;
      color: #1e3a1e;
      padding: 12px;
      border-radius: 60px;
      width: 100%;
      cursor: pointer;
      box-shadow: 0 4px 0 #7e582a;
    }
    .ad-loading {
      background: #6f7c6b;
      cursor: default;
      box-shadow: none;
    }
    .waiting-message {
      background: #315e40;
      color: #ffe0a1;
      cursor: default;
      box-shadow: none;
    }
    .toast-msg {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #2c5a3e;
      color: #ffefcf;
      padding: 10px 20px;
      border-radius: 50px;
      font-weight: bold;
      z-index: 1000;
      animation: fadeOut 2s forwards;
      white-space: nowrap;
    }
    @keyframes fadeOut {
      0% { opacity: 1; }
      70% { opacity: 1; }
      100% { opacity: 0; visibility: hidden; }
    }
    footer {
      background: #173e2b;
      text-align: center;
      font-size: 0.7rem;
      padding: 10px;
      color: #cfcfaa;
    }
  </style>
</head>
<body>
<div class="app-card">
  <div class="header">
    <h1>🕌 Tap & Earn <span style="background:#f9b23f; padding:4px 12px; border-radius:60px;">حلال</span></h1>
    <div class="sub">✨ ہر ٹیپ پر "سبحان اللہ" اور ایک سکہ ✨</div>
  </div>
  <div class="balance-card">
    <h2>🪙 آپ کے سکے</h2>
    <div class="coin-value" id="coinBalance">0</div>
  </div>
  <div class="tap-zone" id="tapZone">
    <div class="tap-circle">👇 یہاں ٹیپ کریں</div>
  </div>
  <div class="ad-panel">
    <div class="timer-info" id="timerDisplayBox"></div>
    <div id="dynamicAdArea"></div>
  </div>
  <footer>🌙 ہر 60 سیکنڈ بعد ویڈیو ایڈ دیکھیں → +50 سکے | ذکرِ الٰہی</footer>
</div>

<script>
  (function() {
    let coins = 0;
    let timeLeft = 60;
    let isAdReady = false;
    let isWatchingAd = false;
    let timerInterval = null;

    const coinSpan = document.getElementById('coinBalance');
    const timerDisplayBox = document.getElementById('timerDisplayBox');
    const dynamicAdArea = document.getElementById('dynamicAdArea');
    const tapZone = document.getElementById('tapZone');

    function showToast(message, isSuccess = true) {
      const toast = document.createElement('div');
      toast.className = 'toast-msg';
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 2000);
    }

    function updateUI() {
      coinSpan.textContent = coins;
      // clear timer area
      timerDisplayBox.innerHTML = '';
      dynamicAdArea.innerHTML = '';

      if (isAdReady) {
        const timerSpan = document.createElement('span');
        timerSpan.textContent = '🎁 ایڈ تیار ہے! ابھی دیکھیں 🔥';
        timerDisplayBox.appendChild(timerSpan);
        
        const btn = document.createElement('button');
        btn.className = 'ad-button';
        btn.textContent = '▶️ ویڈیو ایڈ دیکھیں (+50 سکے)';
        btn.addEventListener('click', () => handleWatchAd());
        dynamicAdArea.appendChild(btn);
      } 
      else if (isWatchingAd) {
        const timerSpan = document.createElement('span');
        timerSpan.textContent = '📡 ایڈ چل رہا ہے... صبر کریں 📺';
        timerDisplayBox.appendChild(timerSpan);
        
        const loadingDiv = document.createElement('div');
        loadingDiv.className = 'ad-loading';
        loadingDiv.textContent = '📺 ویڈیو ایڈ چل رہا ہے (5 سیکنڈ)...';
        dynamicAdArea.appendChild(loadingDiv);
      }
      else {
        const timerSpan = document.createElement('span');
        timerSpan.textContent = `⏳ اگلا ایڈ میں: ${timeLeft} سیکنڈ`;
        timerDisplayBox.appendChild(timerSpan);
        
        const waitDiv = document.createElement('div');
        waitDiv.className = 'waiting-message';
        waitDiv.textContent = `🕋 ایڈ آنے میں ${timeLeft} سیکنڈ باقی ہیں ۔ صبر و شکر 🤲`;
        dynamicAdArea.appendChild(waitDiv);
      }
    }

    function startTimer() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (isWatchingAd) return;
        if (isAdReady) return;
        if (timeLeft > 0) {
          timeLeft--;
          updateUI();
          if (timeLeft === 0) {
            isAdReady = true;
            updateUI();
          }
        }
      }, 1000);
    }

    function handleWatchAd() {
      if (!isAdReady || isWatchingAd) return;
      isWatchingAd = true;
      isAdReady = false;
      updateUI();

      setTimeout(() => {
        if (isWatchingAd) {
          coins += 50;
          timeLeft = 60;
          isAdReady = false;
          isWatchingAd = false;
          updateUI();
          showToast('🎉 مبارک! 50 سکے مل گئے۔ اللہ قبول فرمائے 🤲', true);
        }
      }, 5000);
    }

    function createFloatingDhikr(clientX, clientY, rect) {
      const relativeX = clientX - rect.left;
      const relativeY = clientY - rect.top;
      const floatDiv = document.createElement('div');
      floatDiv.className = 'floating-dhikr';
      floatDiv.textContent = 'سبحان اللہ';
      floatDiv.style.left = `${relativeX - 20}px`;
      floatDiv.style.top = `${relativeY - 35}px`;
      floatDiv.style.position = 'absolute';
      tapZone.style.position = 'relative';
      tapZone.appendChild(floatDiv);
      setTimeout(() => floatDiv.remove(), 900);
    }

    function onTap(event) {
      coins++;
      updateUI();

      let clientX, clientY;
      if (event.touches) {
        clientX = event.touches[0].clientX;
        clientY = event.touches[0].clientY;
        event.preventDefault();
      } else {
        clientX = event.clientX;
        clientY = event.clientY;
      }
      const rect = tapZone.getBoundingClientRect();
      if (clientX >= rect.left && clientX <= rect.right && clientY >= rect.top && clientY <= rect.bottom) {
        createFloatingDhikr(clientX, clientY, rect);
      } else {
        const fallbackX = rect.left + rect.width/2;
        const fallbackY = rect.top + rect.height/2;
        createFloatingDhikr(fallbackX, fallbackY, rect);
      }
    }

    tapZone.addEventListener('touchstart', (e) => { e.preventDefault(); onTap(e); }, { passive: false });
    tapZone.addEventListener('click', onTap);

    function init() {
      coins = 0;
      timeLeft = 60;
      isAdReady = false;
      isWatchingAd = false;
      updateUI();
      startTimer();
    }
    init();
  })();
</script>
</body>
</html>
